name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check ml/

      # data/raw/ and data/processed/ are gitignored (regenerated, not
      # committed) - preprocess.py self-downloads all 4 source datasets,
      # so CI always runs the full multi-task merge pipeline from scratch.
      - name: Run preprocessing pipeline
        run: python ml/preprocess.py

      - name: Run baseline models
        run: python ml/baseline.py

      - name: Run per-task XGBoost experiments
        run: python ml/experiments_per_task_models.py

      - name: Run feature engineering
        run: python ml/feature_engineering.py

      - name: Run calibration + applicability domain
        run: python ml/calibration.py

      - name: Run model registry
        run: python ml/model_registry.py

      - name: Run full evaluation
        run: python ml/evaluate.py

      - name: Test (pytest)
        run: pytest ml/tests/ -v

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt || true

      # Shared with the backend job below so it doesn't have to re-run the
      # whole preprocess->baseline->per-task->registry chain just to get a
      # model to serve - models.joblib (~125MB) is gitignored, not committed.
      - name: Upload production model artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-model
          path: models/production/
          retention-days: 1

  backend:
    needs: ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Download production model artifact
        uses: actions/download-artifact@v4
        with:
          name: production-model
          path: models/production/

      - name: Test (pytest + coverage)
        run: pytest backend/tests/ --cov=backend/app --cov-report=term-missing

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt || true

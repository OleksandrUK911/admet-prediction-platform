name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check ml/

      # data/raw/ and data/processed/ are gitignored (regenerated, not
      # committed) - preprocess.py self-downloads all 4 source datasets,
      # so CI always runs the full multi-task merge pipeline from scratch.
      - name: Run preprocessing pipeline
        run: python ml/preprocess.py

      - name: Run baseline models
        run: python ml/baseline.py

      - name: Run per-task XGBoost experiments
        run: python ml/experiments_per_task_models.py

      - name: Run feature engineering
        run: python ml/feature_engineering.py

      - name: Run calibration + applicability domain
        run: python ml/calibration.py

      - name: Run model registry
        run: python ml/model_registry.py

      - name: Run full evaluation
        run: python ml/evaluate.py

      - name: Run experiment-tracking summary
        run: python ml/experiments_tracking_summary.py

      - name: Check ML regression gate (per-task metrics + calibration ECE)
        run: python ml/check_regression_gate.py

      - name: Test (pytest)
        run: pytest ml/tests/ -v

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r requirements.txt || true

      # Shared with the backend job below so it doesn't have to re-run the
      # whole preprocess->baseline->per-task->registry chain just to get a
      # model to serve - models.joblib (~125MB) is gitignored, not committed.
      # data/processed/admet_processed.csv is included too - ModelService
      # loads it at startup to build the applicability-domain NN index.
      - name: Upload production model artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-model
          path: |
            models/production/
            data/processed/admet_processed.csv
          retention-days: 1

  backend:
    needs: ml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Download production model artifact
        uses: actions/download-artifact@v4
        with:
          name: production-model
          path: .

      - name: Test (pytest + coverage)
        run: pytest backend/tests/ --cov=backend/app --cov-report=term-missing

      - name: Audit dependencies (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

  # Builds and publishes Docker images to GHCR, but only on an actual push
  # to main - not on pull_request builds, which would publish images from
  # unreviewed/untrusted branches. Gated on all three test jobs so a broken
  # build/test never gets published as :latest.
  publish-images:
    needs: [ml, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # backend/Dockerfile COPYs models/production/ + admet_processed.csv
      # from the build context (see backend-spec) - both are gitignored
      # build artifacts, produced by the ml job and shared via this same
      # upload/download-artifact pair the backend job already uses above.
      - name: Download production model artifact
        uses: actions/download-artifact@v4
        with:
          name: production-model
          path: .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # GHCR/Docker repository names must be lowercase - github.repository_owner
      # can contain uppercase letters (e.g. "OleksandrUK911"), so it can't be
      # used directly in an image tag.
      - name: Compute lowercase image owner
        id: image
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/admet-prediction-platform-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          # Baked-in API base URL points at ghcr.io images' expected deploy
          # target - a real deploy overrides this build-arg for its own
          # host; :latest here is a demo/portfolio artifact, not a pinned
          # production build.
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
          tags: ghcr.io/${{ steps.image.outputs.owner }}/admet-prediction-platform-frontend:latest
